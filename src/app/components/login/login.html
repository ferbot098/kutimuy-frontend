<main class="login-contenedor" id="contenido-principal">

  <div class="login-caja">

    <h1>Kutimuy Hotel</h1>

    <h2>Iniciar sesión</h2>

    <form (ngSubmit)="iniciarSesion()" novalidate>

      <div class="campo">
        <label for="email">Email</label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="credenciales.email"
          placeholder="Ingrese su email"
          autocomplete="username"
          required>
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>

        <div class="password-contenedor">
          <input
            id="password"
            [type]="mostrarPassword ? 'text' : 'password'"
            name="password"
            [(ngModel)]="credenciales.password"
            placeholder="Ingrese su contraseña"
            autocomplete="current-password"
            required>

          <button
            type="button"
            class="mostrar-password"
            [attr.aria-label]="mostrarPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            [attr.aria-pressed]="mostrarPassword"
            (click)="alternarPassword()">
            {{ mostrarPassword ? 'Ocultar' : 'Mostrar' }}
          </button>
        </div>
      </div>

      <button
        type="submit"
        [disabled]="cargando">
        {{ cargando ? 'Ingresando...' : 'Ingresar' }}
      </button>

    </form>

    <p class="mensaje" role="alert" aria-live="polite">{{ mensaje }}</p>

  </div>

</main>
